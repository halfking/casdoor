<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaixuan Brand Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --card: rgba(255, 255, 255, 0.88);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(148, 163, 184, 0.28);
      --dark-bg: #0f172a;
      --dark-card: rgba(15, 23, 42, 0.82);
      --dark-border: rgba(148, 163, 184, 0.22);
      --dark-text: #e2e8f0;
      --shadow: 0 24px 48px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(22, 119, 255, 0.14), transparent 32%),
        radial-gradient(circle at top right, rgba(15, 179, 122, 0.14), transparent 28%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1320px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      letter-spacing: 0.04em;
    }

    p.lead {
      margin: 0 0 28px;
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
    }

    .section {
      margin-top: 28px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .section.dark {
      background: var(--dark-card);
      border-color: var(--dark-border);
      color: var(--dark-text);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 21px;
      letter-spacing: 0.06em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .logo-card {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    .dark .logo-card {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.16);
    }

    .logo-card h3 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: inherit;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 auto;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      background: #fff;
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .brand-lockup .icon {
      width: 54px;
      height: 54px;
      margin: 0;
    }

    .brand-text {
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #111827;
    }

    .dark .brand-text {
      color: #f8fafc;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }

      main {
        width: min(100vw - 24px, 1320px);
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>

  </main>
</body>
</html>
