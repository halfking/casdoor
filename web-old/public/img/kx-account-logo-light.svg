<svg xmlns="http://www.w3.org/2000/svg" width="320" height="88" viewBox="0 0 320 88" role="img" aria-labelledby="title desc">
  <title id="title">开轩智财</title>
  <desc id="desc">开轩智财品牌标识</desc>
  <defs>
    <linearGradient id="kxAccountLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- 圆形底 -->
  <circle cx="44" cy="44" r="36" fill="url(#kxAccountLightGrad)"/>
  <!-- 凭证纸 -->
  <rect x="28" y="22" width="32" height="44" rx="3" fill="#ffffff" opacity="0.92"/>
  <!-- 横线（账目行） -->
  <line x1="33" y1="31" x2="55" y2="31" stroke="#4f46e5" stroke-width="1" opacity="0.35"/>
  <line x1="33" y1="38" x2="55" y2="38" stroke="#4f46e5" stroke-width="1" opacity="0.35"/>
  <line x1="33" y1="45" x2="55" y2="45" stroke="#4f46e5" stroke-width="1" opacity="0.35"/>
  <line x1="33" y1="52" x2="47" y2="52" stroke="#4f46e5" stroke-width="1" opacity="0.35"/>
  <!-- ¥ 符号 -->
  <text x="48" y="60" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#4f46e5" opacity="0.8">¥</text>
  <!-- 审核勾号 -->
  <polyline points="50,28 53,32 59,24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 品牌文字 -->
  <text x="98" y="53" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#111827" letter-spacing="1.5">开轩智财</text>
</svg>
