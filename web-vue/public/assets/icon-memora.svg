<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="memoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#memoraGrad)"/>
  
  <!-- 六边形网格 - 科技感 -->
  <g opacity="0.3">
    <!-- 中心点 -->
    <circle cx="24" cy="24" r="4" fill="white" opacity="0.9"/>
    
    <!-- 内圈节点 -->
    <circle cx="24" cy="12" r="2.5" fill="url(#nodeGlow)"/>
    <circle cx="34.9" cy="18" r="2.5" fill="url(#nodeGlow)"/>
    <circle cx="34.9" cy="30" r="2.5" fill="url(#nodeGlow)"/>
    <circle cx="24" cy="36" r="2.5" fill="url(#nodeGlow)"/>
    <circle cx="13.1" cy="30" r="2.5" fill="url(#nodeGlow)"/>
    <circle cx="13.1" cy="18" r="2.5" fill="url(#nodeGlow)"/>
    
    <!-- 外圈节点 -->
    <circle cx="24" cy="6" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="38" cy="12" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="38" cy="36" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="24" cy="42" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="10" cy="36" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="10" cy="12" r="1.5" fill="white" opacity="0.6"/>
    
    <!-- 连接线 -->
    <line x1="24" y1="20" x2="24" y2="14.5" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="30.9" y1="22" x2="33.9" y2="19" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="30.9" y1="26" x2="33.9" y2="29" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="24" y1="28" x2="24" y2="33.5" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="17.1" y1="26" x2="14.1" y2="29" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="17.1" y1="22" x2="14.1" y2="19" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <!-- 外圈连接 -->
    <line x1="24" y1="10.5" x2="24" y2="7.5" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="34" y1="15" x2="37" y2="13" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="34" y1="33" x2="37" y2="35" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="24" y1="37.5" x2="24" y2="40.5" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="14" y1="33" x2="11" y2="35" stroke="white" stroke-width="0.8" opacity="0.3"/>
    <line x1="14" y1="15" x2="11" y2="13" stroke="white" stroke-width="0.8" opacity="0.3"/>
  </g>
  
  <!-- 高光 -->
  <circle cx="16" cy="16" r="3" fill="white" opacity="0.15"/>
</svg>