<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#cliGrad)"/>
  <!-- 终端: 命令行窗口 + 提示符 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- 终端窗口外框 -->
    <rect x="8" y="10" width="32" height="28" rx="3" stroke-width="2" fill="white" fill-opacity="0.1"/>
    <!-- 标题栏 -->
    <line x1="8" y1="17" x2="40" y2="17" stroke-width="1.2" opacity="0.4"/>
    <!-- 标题栏按钮 -->
    <circle cx="13" cy="13.5" r="1.5" fill="#ef4444" stroke="none" opacity="0.7"/>
    <circle cx="18" cy="13.5" r="1.5" fill="#eab308" stroke="none" opacity="0.7"/>
    <circle cx="23" cy="13.5" r="1.5" fill="#22c55e" stroke="none" opacity="0.7"/>
    <!-- 提示符 > -->
    <path d="M13 23 L18 26.5 L13 30" stroke-width="2.2"/>
    <!-- 光标闪烁线 -->
    <line x1="21" y1="30" x2="30" y2="30" stroke-width="2" opacity="0.8"/>
    <!-- 箭头：从app到cli的桥接 -->
    <path d="M28 21 L35 21" stroke-width="1.6" opacity="0.5"/>
    <path d="M33 19 L36 21 L33 23" stroke-width="1.6" fill="none" opacity="0.5"/>
  </g>
</svg>
