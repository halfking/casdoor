<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#radarGrad)"/>
  
  <!-- 雷达图标 -->
  <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 雷达扫描线 -->
    <circle cx="24" cy="24" r="18" stroke-dasharray="4 2" opacity="0.4"/>
    <circle cx="24" cy="24" r="12" stroke-dasharray="4 2" opacity="0.6"/>
    <circle cx="24" cy="24" r="6" fill="white" fill-opacity="0.3"/>
    
    <!-- 中心点 -->
    <circle cx="24" cy="24" r="3" fill="white"/>
    
    <!-- 信号波纹 -->
    <path d="M24 14 Q32 24 24 34" stroke-width="2" opacity="0.7"/>
    
    <!-- 目标点 -->
    <circle cx="30" cy="18" r="2" fill="white" opacity="0.8"/>
    <circle cx="18" cy="30" r="2" fill="white" opacity="0.8"/>
  </g>
</svg>