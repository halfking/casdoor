<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="orchestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#orchestGrad)"/>
  
  <!-- 网络/编排图标 -->
  <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 中心节点 -->
    <circle cx="24" cy="24" r="5" fill="white" fill-opacity="0.3"/>
    <circle cx="24" cy="24" r="3" fill="white"/>
    
    <!-- 连接节点 -->
    <circle cx="12" cy="16" r="3" fill="white" fill-opacity="0.8"/>
    <circle cx="36" cy="16" r="3" fill="white" fill-opacity="0.8"/>
    <circle cx="12" cy="32" r="3" fill="white" fill-opacity="0.8"/>
    <circle cx="36" cy="32" r="3" fill="white" fill-opacity="0.8"/>
    
    <!-- 连接线 -->
    <line x1="16" y1="19" x2="20" y2="22" stroke-width="1.5" opacity="0.6"/>
    <line x1="32" y1="19" x2="28" y2="22" stroke-width="1.5" opacity="0.6"/>
    <line x1="16" y1="29" x2="20" y2="26" stroke-width="1.5" opacity="0.6"/>
    <line x1="32" y1="29" x2="28" y2="26" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 数据流动 -->
    <path d="M15 16 L22 22" stroke-dasharray="2 2" opacity="0.4"/>
    <path d="M33 16 L26 22" stroke-dasharray="2 2" opacity="0.4"/>
  </g>
</svg>