<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="accDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#accDarkGrad)"/>
  
  <!-- 机器人/AI图标 - 科技感 -->
  <g fill="none" stroke="white" stroke-width="2">
    <!-- 头部轮廓 -->
    <rect x="14" y="12" width="20" height="18" rx="4" fill="white" fill-opacity="0.2"/>
    
    <!-- 天线 -->
    <line x1="24" y1="8" x2="24" y2="12" stroke-linecap="round"/>
    <circle cx="24" cy="7" r="2" fill="white"/>
    
    <!-- 眼睛 -->
    <circle cx="19" cy="19" r="2" fill="white"/>
    <circle cx="29" cy="19" r="2" fill="white"/>
    
    <!-- 嘴巴 -->
    <line x1="19" y1="25" x2="29" y2="25" stroke-linecap="round"/>
    
    <!-- 身体 -->
    <path d="M16 30 L16 38 L32 38 L32 30" fill="white" fill-opacity="0.15"/>
    
    <!-- 手臂 -->
    <line x1="12" y1="32" x2="16" y2="32" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="36" y2="32" stroke-linecap="round"/>
    
    <!-- 状态指示灯 -->
    <circle cx="24" cy="34" r="1.5" fill="white"/>
  </g>
</svg>