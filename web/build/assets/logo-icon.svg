<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677ff"/>
      <stop offset="100%" stop-color="#0fb37a"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="url(#bgGrad)"/>

  <!-- "开" 字符 -->
  <text x="100" y="125" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="700" fill="#ffffff">开</text>
</svg>
