services:
  casdoor:
    restart: always
    # 构建上下文必须为 services/casdoor（含 web-vue/），否则 Dockerfile 中 COPY ./web-vue 会失败
    build:
      context: .
      dockerfile: Dockerfile
      target: STANDARD
      args:
        CASDOOR_WEB_RELEASE: "${CASDOOR_WEB_RELEASE:-dev}"
    entrypoint: /bin/sh -c './server --createDatabase=true'
    ports:
      - "4800:8000"
    depends_on:
      - postgres
    environment:
      RUNNING_IN_DOCKER: "true"
      CASDOOR_DB_PASS: "${CASDOOR_DB_PASS:?CASDOOR_DB_PASS must be set in .env or shell}"
      CASDOOR_DB_HOST: "${CASDOOR_DB_HOST:-pms-postgres}"
      driverName: "postgres"
      dataSourceName: "postgres://casdoor:${CASDOOR_DB_PASS:?CASDOOR_DB_PASS must be set in .env or shell}@${CASDOOR_DB_HOST:-pms-postgres}:5432/casdoor?sslmode=disable"
    volumes:
      - ./conf:/conf/
      - ./init_data.json:/init_data.json
      # 不要挂载 ./web/build：会覆盖镜像内 Dockerfile FRONT 阶段生成的静态资源；
      # 若需宿主机覆盖，请先执行 scripts/build-web-vue-release.sh 生成 web/build
    networks:
      - casdoor_casdoor-network
      - local_pms-network

  postgres:
    restart: always
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: "${CASDOOR_DB_PASS:?CASDOOR_DB_PASS must be set in .env or shell}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - casdoor_casdoor-network

networks:
  casdoor_casdoor-network:
    driver: bridge
  local_pms-network:
    external: true

volumes:
  postgres-data:
